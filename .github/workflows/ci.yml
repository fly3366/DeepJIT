name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      # deepjit publishes and git-installs from the committed dist/ (files:["dist"],
      # no prepublishOnly build), so a stale dist ships broken code. Tests run from
      # tests/*.ts directly and do NOT rebuild dist, so build here, then fail if the
      # freshly built output differs from what is committed.
      - name: Verify committed dist matches src
        run: npm run build && git diff --exit-code dist
